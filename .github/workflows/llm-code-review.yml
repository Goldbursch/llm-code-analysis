name: LLM Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  llm-review:
    runs-on: ubuntu-latest
    name: Analyse code changes with OpenAI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required so that git diff can reach the base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------ #
      # Expose the base SHA so that the Python script can build the diff.   #
      # ------------------------------------------------------------------ #
      - name: Expose base SHA (pull_request)
        if: github.event_name == 'pull_request'
        run: echo "GITHUB_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"

      - name: Expose before SHA (push)
        if: github.event_name == 'push'
        run: echo "GITHUB_BEFORE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # Run the LLM analysis.                                               #
      # ------------------------------------------------------------------ #
      - name: Run LLM code analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override the model via a repository variable if desired.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
        run: python scripts/analyze_code.py

      # ------------------------------------------------------------------ #
      # Persist the generated feedback files as a workflow artifact so      #
      # that they can be downloaded and compared for the thesis.            #
      # ------------------------------------------------------------------ #
      - name: Upload feedback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-code-review-${{ github.sha }}
          path: feedback/
          # Retain artifacts for 90 days (maximum for public repos).
          retention-days: 90
          if-no-files-found: warn
